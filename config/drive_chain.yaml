# Автоцепочка для всего Drive-корпуса без огромного seed-артефакта.
# Старый seed-run merged_data_7.txt успешен, но его artifact вышел ~44 ГБ,
# поэтому цепочка переучивает 7-ю часть первой и дальше передаёт slim-checkpoint.

enabled: true
seed_resume_run_id: ""

drive_folder_url: "https://drive.google.com/drive/folders/1u_rcfQ6P50bK4H23tmrh20U_2BRDVEm5?usp=drive_link"
