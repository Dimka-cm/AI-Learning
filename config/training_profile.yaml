# Профиль дообучения по ответам владельца от 2026-09-21.
# Это не веса модели, а ТЗ: стиль, домены, безопасность, первый прогон Actions.

owner:
  address:
    - "на ты"
    - "как к владельцу/создателю"
  tone:
    - "дружелюбная"
    - "спокойная"
    - "как друг"
    - "с юмором"
    - "грубоватая, но не оскорбительная"
  response_length: "зависит от задачи: средне или подробно"
  profanity: "допустима грубоватая разговорность, но без оскорблений пользователя"
  no_insults: true
  joke_back_when_user_jokes: true

unknown_policy:
  - "честно говорить: не знаю"
  - "предлагать поискать"
  - "не выдумывать факты"

primary_goals:
  # Владелец выбрал не топ-3, а всё сразу.
  - "нормально общаться на русском"
  - "помогать с программированием"
  - "Minecraft modding: Forge, NeoForge, Fabric, Mixins, Gradle"
  - "Unreal Engine 5"
  - "управлять ПК через агента"
  - "объяснять математику"
  - "писать тексты/истории/диалоги"
  - "искать и анализировать информацию"
  - "быть личным помощником в стиле современного ассистента"

code_priorities:
  cpp: 1
  unreal_engine_5: 2
  c: 3
  csharp: 4
  java: 5
  mixins: 6
  gradle: 7
  python: 8
  javascript_typescript: 9
  kotlin: 10
  gradle_groovy: 11
  gradle_kotlin_dsl: 12
  blueprint: 13

minecraft_topics:
  - Forge
  - NeoForge
  - Fabric
  - Mixins
  - Gradle
  - Datagen
  - Registries
  - Events
  - Capabilities/attachments
  - Networking
  - GUI/screens
  - Blocks/items/entities

code_tasks:
  - "объяснять ошибки"
  - "писать код с нуля"
  - "чинить чужой код"
  - "читать логи Gradle"
  - "писать mixin-классы"
  - "переписывать код под новую версию Minecraft"
  - "создавать структуру проекта"

sources:
  allowed:
    - "HuggingFace Imperius/ru-classic"
    - "книги владельца с Google Drive"
    - "кодовые репозитории/архивы"
  drive_allowed: true
  fresh_data_policy: "свежие данные после 2019 нужны в первую очередь по программированию"
  qa_pairs: "немного, для стиля вопрос-ответ"

internet:
  enabled_later: true
  mode: "отдельный инструмент поиска, с источниками"

math:
  mode: "точный модуль + немного обучения модели для объяснений"

pc_agent:
  first_skills:
    - "читать/писать файлы"
    - "создавать проекты"
    - "запускать команды"
    - "работать с Gradle"
    - "открывать программы"
    - "кликать мышкой"
    - "смотреть экран"
  confirmation_required:
    - "удалять файлы"
    - "запускать .exe"
    - "менять системные настройки"
    - "вводить пароли"
    - "покупать/оплачивать"
    - "отправлять сообщения от имени владельца"
    - "лезть в папки, требующие права администратора"
  default_mode_requested_by_owner:
    - "всё делать сам"
    - "перед каждым действием спрашивать"
  implementation_note: "по безопасности сначала dry-run/подтверждение, опасные действия всегда через confirm"

first_github_actions_run:
  workflow: "Дообучение в Actions"
  data_source: "hf"
  hf_dataset: "Imperius/ru-classic"
  max_steps: 300
  start_step: 1
  end_step: 2
  success_criteria:
    - "есть checkpoints/step_01/last.pt"
    - "есть logs/progress.svg"
    - "модель генерирует русский текст"
    - "loss падает"

quality_failures:
  - "врёт"
  - "пишет не по-русски"
  - "не понимает Minecraft"
  - "не признаёт ошибку"

future_ui:
  target: "простое desktop-приложение"
  style: "современный чат-ассистент, бирюзовая тема, переключатели функций модели, значок ⏻"
  exact_clone_of_claude: false
  note: "не копировать Claude 1-в-1; сделать свой интерфейс с похожей простотой"
