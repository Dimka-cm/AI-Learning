name: Дообучение части Drive

# Автозапуск без workflow_dispatch-токена: агент меняет config/drive_part.yaml
# и пушит ветку arena/01a0c067-ai-learning. Workflow читает конфиг и гонит одну
# часть корпуса library/merged_data_N.txt. Для продолжения между частями есть
# resume_run_id: скачивает артефакт предыдущего run и включает RESUME_FROM_LATEST.

on:
  push:
    branches: [arena/01a0c067-ai-learning]
    paths:
      - "config/drive_part.yaml"
      - ".github/workflows/drive-part.yml"
      - "config/train_ci.yaml"
      - "src/**"
      - "steps/**"
      - "scripts/**"
      - "orchestrator.py"
  workflow_dispatch:

concurrency:
  group: drive-part-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"
  HF_HOME: ${{ github.workspace }}/hf-cache
  TORCH_HOME: ${{ github.workspace }}/torch-cache
  GRAD_CACHE: ${{ github.workspace }}/grad-cache
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  train-drive-part:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установка зависимостей
        run: |
          pip install -r requirements.txt
          pip install gdown

      - name: Прочитать config/drive_part.yaml
        id: drivecfg
        run: |
          python - <<'PY'
          import os
          import yaml

          with open('config/drive_part.yaml', 'r', encoding='utf-8') as f:
              cfg = yaml.safe_load(f) or {}

          fields = {
              'enabled': str(bool(cfg.get('enabled', True))).lower(),
              'drive_folder_url': str(cfg.get('drive_folder_url', '') or ''),
              'drive_file_regex': str(cfg.get('drive_file_regex', '') or ''),
              'drive_max_files': str(cfg.get('drive_max_files', 0) or 0),
              'data_limit_mb': str(cfg.get('data_limit_mb', 25) or 25),
              'drive_budget_s': str(cfg.get('drive_budget_s', 3600) or 3600),
              'start_step': str(cfg.get('start_step', 1) or 1),
              'end_step': str(cfg.get('end_step', 4) or 4),
              'max_steps': str(cfg.get('max_steps', 300) or 300),
              'resume_run_id': str(cfg.get('resume_run_id', '') or ''),
              'eval_limit': str(cfg.get('eval_limit', 12) or 12),
          }

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('DATA_SOURCE=drive\n')
              env.write(f'DRIVE_FOLDER_URL={fields["drive_folder_url"]}\n')
              env.write(f'DRIVE_INCLUDE_REGEX={fields["drive_file_regex"]}\n')
              env.write(f'DRIVE_MAX_FILES={fields["drive_max_files"]}\n')
              env.write(f'LIMIT_MB={fields["data_limit_mb"]}\n')
              env.write(f'DRIVE_BUDGET_S={fields["drive_budget_s"]}\n')
              env.write(f'START_STEP={fields["start_step"]}\n')
              env.write(f'END_STEP={fields["end_step"]}\n')
              env.write(f'MAX_STEPS={fields["max_steps"]}\n')
              env.write(f'RESUME_RUN_ID={fields["resume_run_id"]}\n')
              env.write(f'EVAL_LIMIT={fields["eval_limit"]}\n')
              env.write('EPOCHS_PER_STEP=1\n')
              env.write('LOG_EVERY_STEPS=5\n')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              for k, v in fields.items():
                  out.write(f'{k}={v}\n')

          print('[drive cfg]')
          for k, v in fields.items():
              print(f'{k}={v}')
          PY

      - name: Проверить enabled
        if: ${{ steps.drivecfg.outputs.enabled != 'true' }}
        run: |
          echo "config/drive_part.yaml: enabled=false, выходим без обучения"
          exit 0

      - name: Восстановить чекпоинт из прошлого запуска
        if: ${{ steps.drivecfg.outputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ci-checkpoint-progress
          run-id: ${{ steps.drivecfg.outputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: .

      - name: Кэш модели HF
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/hf-cache
            ${{ github.workspace }}/torch-cache
          key: hf-${{ runner.os }}-rugpt3-${{ github.sha }}
          restore-keys: |
            hf-${{ runner.os }}-rugpt3-

      - name: Данные Drive + токенизация
        timeout-minutes: 180
        run: python steps/step_00_ci_data.py

      - name: Дообучение выбранной части
        run: |
          NPROC=$(nproc)
          echo "Раннер: $NPROC ядер CPU, $(free -m | awk '/Mem:/{print $2}') МБ RAM"
          export OMP_NUM_THREADS=$NPROC
          export NUM_WORKERS=auto
          if [ -n "$RESUME_RUN_ID" ]; then
            export RESUME_FROM_LATEST=1
          fi
          python orchestrator.py \
            --start "$START_STEP" \
            --end "$END_STEP" \
            --device cpu \
            --evaluate

      - name: Пробные ответы модели
        if: always()
        run: |
          mkdir -p logs
          if compgen -G "checkpoints/step_*/last.pt" > /dev/null; then
            python scripts/evaluate_prompts.py \
              --limit "$EVAL_LIMIT" \
              --out logs/eval_answers.md || true
          else
            echo "# Пробные ответы модели" > logs/eval_answers.md
            echo "" >> logs/eval_answers.md
            echo "Чекпоинт не найден — генерацию ответов пропускаю." >> logs/eval_answers.md
          fi

      - name: Выкачать прогресс
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-checkpoint-progress
          path: |
            logs/*.jsonl
            logs/progress.svg
            logs/eval_answers.md
            checkpoints/**/*.pt
          if-no-files-found: warn

      - name: Сводка
        if: always()
        shell: bash
        run: |
          {
            echo "## Дообучение части Drive"
            echo ""
            echo "- file regex: \`$DRIVE_INCLUDE_REGEX\`"
            echo "- max files: \`$DRIVE_MAX_FILES\`"
            echo "- data limit: \`$LIMIT_MB MB\`"
            echo "- steps: \`$START_STEP..$END_STEP\`"
            echo "- max_steps: \`$MAX_STEPS\`"
            echo "- resume_run_id: \`${RESUME_RUN_ID:-нет}\`"
            echo ""
            echo "| шаг | loss (первый → последний) |"
            echo "| --- | --- |"
            for f in logs/step_*.jsonl; do
              [ -f "$f" ] || continue
              first=$(python -c "import json;d=[json.loads(l) for l in open('$f')];e=[x for x in d if x.get('event')=='train'];print(e[0]['loss'] if e else '-')" 2>/dev/null)
              last=$(python -c "import json;d=[json.loads(l) for l in open('$f')];e=[x for x in d if x.get('event')=='train'];print(e[-1]['loss'] if e else '-')" 2>/dev/null)
              echo "| \`$(basename "$f")\` | $first → $last |"
            done
            if [ -f logs/eval_answers.md ]; then
              echo ""
              echo "### Пробные ответы"
              sed -n '1,80p' logs/eval_answers.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
