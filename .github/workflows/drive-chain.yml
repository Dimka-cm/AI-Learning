name: Дообучение Drive цепочкой 1..6

# Запускается обычным push без PAT. Сначала ждёт seed-run с merged_data_7.txt,
# затем последовательно гонит merged_data_1.txt ... merged_data_6.txt, передавая
# финальный checkpoint через artifact chain-checkpoint.tar.gz.

on:
  push:
    branches: [arena/01a0c067-ai-learning]
    paths:
      - "config/drive_chain.yaml"
      - ".github/workflows/drive-chain.yml"
      - "scripts/ci_train_drive_part.sh"
      - "config/train_ci.yaml"
      - "src/**"
      - "steps/**"
      - "scripts/**"
      - "orchestrator.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: drive-chain-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"
  HF_HOME: ${{ github.workspace }}/hf-cache
  TORCH_HOME: ${{ github.workspace }}/torch-cache
  GRAD_CACHE: ${{ github.workspace }}/grad-cache
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  wait-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      enabled: ${{ steps.cfg.outputs.enabled }}
      seed_run_id: ${{ steps.cfg.outputs.seed_run_id }}
      drive_folder_url: ${{ steps.cfg.outputs.drive_folder_url }}
      data_limit_mb: ${{ steps.cfg.outputs.data_limit_mb }}
      drive_budget_s: ${{ steps.cfg.outputs.drive_budget_s }}
      start_step: ${{ steps.cfg.outputs.start_step }}
      end_step: ${{ steps.cfg.outputs.end_step }}
      max_steps: ${{ steps.cfg.outputs.max_steps }}
      eval_limit: ${{ steps.cfg.outputs.eval_limit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read chain config
        id: cfg
        run: |
          python - <<'PY'
          import os, yaml
          cfg = yaml.safe_load(open('config/drive_chain.yaml', encoding='utf-8')) or {}
          fields = {
              'enabled': str(bool(cfg.get('enabled', True))).lower(),
              'seed_run_id': str(cfg.get('seed_resume_run_id', '') or ''),
              'drive_folder_url': str(cfg.get('drive_folder_url', '') or ''),
              'data_limit_mb': str(cfg.get('data_limit_mb', 2000) or 2000),
              'drive_budget_s': str(cfg.get('drive_budget_s', 3600) or 3600),
              'start_step': str(cfg.get('start_step', 1) or 1),
              'end_step': str(cfg.get('end_step', 4) or 4),
              'max_steps': str(cfg.get('max_steps', 300) or 300),
              'eval_limit': str(cfg.get('eval_limit', 4) or 4),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              for k, v in fields.items():
                  out.write(f'{k}={v}\n')
          print(fields)
          PY

      - name: Wait seed run
        if: ${{ steps.cfg.outputs.enabled == 'true' && steps.cfg.outputs.seed_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_RUN_ID: ${{ steps.cfg.outputs.seed_run_id }}
        run: |
          set -euo pipefail
          echo "Waiting for seed run $SEED_RUN_ID"
          for i in $(seq 1 360); do
            status=$(gh run view "$SEED_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status -q .status)
            conclusion=$(gh run view "$SEED_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion -q '.conclusion // ""')
            echo "[$i] seed status=$status conclusion=${conclusion:-none}"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                exit 0
              fi
              echo "Seed run failed/cancelled: $conclusion"
              exit 1
            fi
            sleep 60
          done
          echo "Seed run did not complete in time"
          exit 1

  part-1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    needs: wait-seed
    if: ${{ needs.wait-seed.outputs.enabled == 'true' }}
    env:
      DRIVE_FOLDER_URL: ${{ needs.wait-seed.outputs.drive_folder_url }}
      DATA_LIMIT_MB: ${{ needs.wait-seed.outputs.data_limit_mb }}
      DRIVE_BUDGET_S: ${{ needs.wait-seed.outputs.drive_budget_s }}
      START_STEP: ${{ needs.wait-seed.outputs.start_step }}
      END_STEP: ${{ needs.wait-seed.outputs.end_step }}
      MAX_STEPS: ${{ needs.wait-seed.outputs.max_steps }}
      EVAL_LIMIT: ${{ needs.wait-seed.outputs.eval_limit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установка зависимостей
        run: |
          pip install -r requirements.txt
          pip install gdown

      - name: Скачать checkpoint seed-run
        uses: actions/download-artifact@v4
        with:
          name: ci-checkpoint-progress
          run-id: ${{ needs.wait-seed.outputs.seed_run_id }}
          github-token: ${{ github.token }}
          path: seed-artifact

      - name: Восстановить только финальный checkpoint seed-run
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil
          import sys

          root = Path('seed-artifact/checkpoints')
          if not root.is_dir():
              print('seed-artifact/checkpoints not found')
              for p in Path('seed-artifact').glob('**/*'):
                  if p.is_file():
                      print(p, p.stat().st_size)
              sys.exit(1)

          # Нужен только один последний checkpoint, иначе копирование всего
          # seed-артефакта дублирует гигабайты и может забить диск раннера.
          cands = list(root.glob('step_*/last.pt'))
          if not cands:
              cands = list(root.glob('step_*/last-*.pt'))
          if not cands:
              print('no checkpoint files in seed artifact')
              for p in root.glob('**/*'):
                  if p.is_file():
                      print(p, p.stat().st_size)
              sys.exit(1)

          def key(p: Path):
              m_step = re.search(r'step_(\d+)', str(p))
              m_last = re.search(r'last(?:-(\d+))?\.pt$', p.name)
              return (int(m_step.group(1) if m_step else 0), int(m_last.group(1) or 0 if m_last else 0), p.stat().st_mtime)

          src = sorted(cands, key=key)[-1]
          rel = src.relative_to(root)
          dst = Path('checkpoints') / rel
          shutil.rmtree('checkpoints', ignore_errors=True)
          dst.parent.mkdir(parents=True, exist_ok=True)
          shutil.move(str(src), str(dst))
          shutil.rmtree('seed-artifact', ignore_errors=True)
          print(f'restored {src} -> {dst} ({dst.stat().st_size} bytes)')
          PY
          find checkpoints -maxdepth 3 -type f -name 'last*.pt' -printf '%p %s bytes\n'

      - name: Обучить merged_data_1.txt
        timeout-minutes: 330
        run: bash scripts/ci_train_drive_part.sh 1

      - name: Загрузить checkpoint части 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain-checkpoint-part-1
          path: |
            chain-checkpoint.tar.gz
            logs/*.jsonl
            logs/progress.svg
            logs/eval_answers.md
          if-no-files-found: warn
          retention-days: 7

      - name: Сводка части 1
        if: always()
        run: |
          {
            echo "## Drive chain: merged_data_1.txt"
            echo ""
            echo "- limit: $DATA_LIMIT_MB MB"
            echo "- steps: $START_STEP..$END_STEP"
            echo "- max_steps: $MAX_STEPS"
            echo ""
            echo "| log | loss first → last |"
            echo "| --- | --- |"
            for f in logs/step_*.jsonl; do
              [ -f "$f" ] || continue
              first=$(python -c "import json;d=[json.loads(l) for l in open('$f')];e=[x for x in d if x.get('event')=='train'];print(e[0]['loss'] if e else '-')" 2>/dev/null)
              last=$(python -c "import json;d=[json.loads(l) for l in open('$f')];e=[x for x in d if x.get('event')=='train'];print(e[-1]['loss'] if e else '-')" 2>/dev/null)
              echo "| \`$(basename "$f")\` | $first → $last |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

