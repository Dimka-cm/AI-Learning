      END_STEP: ${{ needs.init.outputs.end_step }}
      MAX_STEPS: ${{ needs.init.outputs.max_steps }}
      EVAL_LIMIT: ${{ needs.init.outputs.eval_limit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установка зависимостей
        run: |
          pip install -r requirements.txt
          pip install gdown

      - name: Обучить merged_data_7.txt
        timeout-minutes: 330
        run: bash scripts/ci_train_drive_part.sh 7

      - name: Загрузить slim-checkpoint части 7
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain-checkpoint-part-7
          path: |
            chain-checkpoint.tar.gz
            logs/*.jsonl
            logs/progress.svg
            logs/eval_answers.md
          if-no-files-found: warn
          retention-days: 7

      - name: Сводка части 7
        if: always()
        run: |
          {
            echo "## Drive chain: merged_data_7.txt"
            echo ""
            echo "- limit: $DATA_LIMIT_MB MB"
            echo "- steps: $START_STEP..$END_STEP"
            echo "- max_steps: $MAX_STEPS"
            echo ""
            echo "| log | loss first → last |"
            echo "| --- | --- |"
            for f in logs/step_*.jsonl; do
              [ -f "$f" ] || continue
              first=$(python -c "import json;d=[json.loads(l) for l in open('$f')];e=[x for x in d if x.get('event')=='train'];print(e[0]['loss'] if e else '-')" 2>/dev/null)
              last=$(python -c "import json;d=[json.loads(l) for l in open('$f')];e=[x for x in d if x.get('event')=='train'];print(e[-1]['loss'] if e else '-')" 2>/dev/null)
              echo "| \`$(basename "$f")\` | $first → $last |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

