name: Тест обученной модели

on:
  push:
    branches: [arena/01a0c067-ai-learning]
    paths:
      - "config/eval_trained.yaml"
      - ".github/workflows/eval-trained.yml"
      - "eval/model_quality_prompts.yaml"
      - "scripts/evaluate_prompts.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CI: "1"
  HF_HOME: ${{ github.workspace }}/hf-cache
  TORCH_HOME: ${{ github.workspace }}/torch-cache
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  eval-trained:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Прочитать config/eval_trained.yaml
        id: cfg
        run: |
          python - <<'PY'
          import os, yaml
          cfg = yaml.safe_load(open('config/eval_trained.yaml', encoding='utf-8')) or {}
          fields = {
              'enabled': str(bool(cfg.get('enabled', True))).lower(),
              'source_run_id': str(cfg.get('source_run_id', '') or ''),
              'artifact_name': str(cfg.get('artifact_name', 'chain-checkpoint-part-6') or 'chain-checkpoint-part-6'),
              'prompt_limit': str(cfg.get('prompt_limit', 0)),
              'max_new_tokens': str(cfg.get('max_new_tokens', 96) or 96),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              for k, v in fields.items():
                  out.write(f'{k}={v}\n')
          print(fields)
          PY

      - name: Проверить enabled
        if: ${{ steps.cfg.outputs.enabled != 'true' }}
        run: |
          echo "config/eval_trained.yaml: enabled=false, тест пропущен"
          exit 0

      - name: Установка зависимостей
        if: ${{ steps.cfg.outputs.enabled == 'true' }}
        run: |
          pip install -r requirements.txt

      - name: Скачать финальный checkpoint
        if: ${{ steps.cfg.outputs.enabled == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.artifact_name }}
          run-id: ${{ steps.cfg.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: trained-artifact

      - name: Распаковать checkpoint
        if: ${{ steps.cfg.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          tar -xzf trained-artifact/chain-checkpoint.tar.gz
          find checkpoints -maxdepth 3 -type f -name 'last*.pt' -printf '%p %s bytes\n'

      - name: Прогнать eval prompts
        if: ${{ steps.cfg.outputs.enabled == 'true' }}
        run: |
          mkdir -p logs
          python scripts/evaluate_prompts.py \
            --limit "${{ steps.cfg.outputs.prompt_limit }}" \
            --max-new-tokens "${{ steps.cfg.outputs.max_new_tokens }}" \
            --out logs/final_eval_answers.md

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-eval
          path: |
            logs/final_eval_answers.md
          if-no-files-found: warn
          retention-days: 7

      - name: Job Summary
        if: always()
        run: |
          {
            echo "## Тест обученной модели"
            echo ""
            echo "- source_run_id: \`${{ steps.cfg.outputs.source_run_id }}\`"
            echo "- artifact: \`${{ steps.cfg.outputs.artifact_name }}\`"
            echo "- prompt_limit: \`${{ steps.cfg.outputs.prompt_limit }}\`"
            echo "- max_new_tokens: \`${{ steps.cfg.outputs.max_new_tokens }}\`"
            echo ""
            if [ -f logs/final_eval_answers.md ]; then
              echo "### Первые строки отчёта"
              sed -n '1,120p' logs/final_eval_answers.md
            else
              echo "Отчёт не создан."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
