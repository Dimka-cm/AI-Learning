name: Train + Progress

# Управляющий workflow: дирижирует обучением и выводит прогресс.
#
# Два режима:
#  1) self-hosted runner на ноуте (RTX 3060, GPU 1) — реальное обучение.
#  2) ubuntu-latest (CPU) — только смоук-тест на крошечном max_steps.
#
# Прогресс: логи шагов -> artifact -> summary-отчёт + SVG график loss.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Раннер (label)"
        required: true
        default: "self-hosted"
        type: string
      start_step:
        description: "Первый шаг"
        required: true
        default: 1
        type: number
      end_step:
        description: "Последний шаг"
        required: true
        default: 10
        type: number
      epochs:
        description: "Эпох на шаг"
        required: true
        default: 3
        type: number
      gpu_index:
        description: "Какую NVIDIA брать: auto | CUDA-индекс | имя (напр. 3060)"
        required: false
        default: "auto"
        type: string
      max_steps:
        description: "Обрезка шага (0 = полный прогон; для CPU-теста ставь 10)"
        required: false
        default: "0"
        type: string
      data_source:
        description: "Откуда данные: auto / demo (быстро) / drive / hf"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - demo
          - drive
          - hf
      data_limit_mb:
        description: "Потолок объёма данных, МБ (0 = без потолка)"
        required: false
        default: "25"
        type: string
  push:
    branches: [main]
    paths:
      - "config/**"
      - "src/**"
      - "steps/**"
      - "orchestrator.py"
      - ".github/workflows/train.yml"

concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HOME: ${{ github.workspace }}/hf-cache
  TORCH_HOME: ${{ github.workspace }}/torch-cache
  # По push — короткий смоук (40 итераций), руками — можно полный прогон.
  MAX_STEPS: ${{ github.event.inputs.max_steps || (github.event_name == 'push' && '40' || '0') }}
  # По push данных в свежем чекауте нет: демо-корпус, чтобы пайплайн доехал.
  DATA_SOURCE: ${{ github.event.inputs.data_source || (github.event_name == 'push' && 'demo' || 'auto') }}
  LIMIT_MB: ${{ github.event.inputs.data_limit_mb || '25' }}

jobs:
  train:
    # ВАЖНО: по push в workflow нет inputs, поэтому `inputs.runner` пустой.
    # Раньше подставлялся self-hosted, и джоба висела в очереди до таймаута
    # (350 мин), потому что раннер на ноуте не зарегистрирован.
    # Теперь: руками с кнопки -> self-hosted (значение по умолчанию),
    # по push -> обычный ubuntu-latest и короткий смоук.
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Данные (свои .txt / Drive / HF / демо) + токенизация
        # Раньше здесь был `--prepare`: на свежем чекауте данных нет, и шаги
        # падали с FileNotFoundError. Теперь данные гарантированно находятся.
        timeout-minutes: 30
        run: python steps/step_00_ci_data.py
        env:
          CUDA_VISIBLE_DEVICES: ""

      - name: Train steps ${{ github.event.inputs.start_step || 1 }}..${{ github.event.inputs.end_step || (github.event_name == 'push' && 2 || 10) }}
        run: >
          python orchestrator.py
          --start ${{ github.event.inputs.start_step || 1 }}
          --end ${{ github.event.inputs.end_step || (github.event_name == 'push' && 2 || 10) }}
          --epochs ${{ github.event.inputs.epochs || (github.event_name == 'push' && 1 || 3) }}
          --device auto
          --gpu ${{ github.event.inputs.gpu_index || 'auto' }}
          --evaluate

      - name: Upload progress (logs + graph)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-progress
          path: |
            logs/*.jsonl
            logs/progress.svg
          if-no-files-found: warn

      - name: Progress summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 📈 Прогресс обучения"
            echo ""
            if [ -f logs/progress.svg ]; then
              echo "![]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
              # ссылка на артефакт; сам SVG покажем как вложение при наличии
            fi
            echo "| шаг | loss |"
            echo "| --- | --- |"
            for f in logs/step_*.jsonl; do
              [ -f "$f" ] || continue
              first=$(python -c "import json,sys;d=[json.loads(l) for l in open('$f')];e=[x for x in d if x.get('event')=='train'];print(e[0]['loss'] if e else '-')" 2>/dev/null)
              last=$(python -c "import json,sys;d=[json.loads(l) for l in open('$f')];e=[x for x in d if x.get('event')=='train'];print(e[-1]['loss'] if e else '-')" 2>/dev/null)
              echo "| \`$(basename "$f")\` | $first → $last |"
            done
            echo ""
            echo "Источник данных написан в шаге «Данные …» выше."
            echo "По push идёт короткий смоук (40 итераций, шаги 1..2); полный прогон — кнопкой Run workflow."
            echo ""
            echo "График и логи — в артефакте \`training-progress\`."
          } >> "$GITHUB_STEP_SUMMARY"
