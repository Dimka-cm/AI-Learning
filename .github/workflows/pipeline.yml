name: Дообучение в Actions

# Дообучение ruGPT-3 Small прямо на GitHub-раннере (CPU, 2 vCPU / 7 ГБ).
# Это реальный компактный прогон: данные -> токенизация -> дообучение шагов 1..2
# -> чекпоинт-артефакт + график loss в Job Summary. Полноценное обучение — на ноуте.
#
# Данные: DRIVE_FOLDER_URL (папка Google Drive), либо HF_DATASET, либо демо-корпус.

on:
  workflow_dispatch:
    inputs:
      drive_folder_url:
        description: "Ссылка на папку Google Drive с .txt"
        required: false
        default: ""
        type: string
      hf_dataset:
        description: "HF-датасет для стриминга (напр. Imperius/ru-classic)"
        required: false
        default: ""
        type: string
      data_source:
        description: "Откуда данные: auto / demo (быстро) / drive / hf"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - demo
          - drive
          - hf
      data_limit_mb:
        description: "Потолок объёма данных, МБ (0 = без потолка)"
        required: false
        default: "25"
        type: string
      drive_file_regex:
        description: "Drive: regex имени .txt (например part_07); пусто = любые"
        required: false
        default: ""
        type: string
      drive_max_files:
        description: "Drive: максимум .txt после фильтра (0 = сколько влезет)"
        required: false
        default: "0"
        type: string
      drive_budget_s:
        description: "Drive: лимит времени скачивания в секундах"
        required: false
        default: "3600"
        type: string
      resume_run_id:
        description: "ID прошлого run, откуда скачать ci-checkpoint-progress для продолжения"
        required: false
        default: ""
        type: string
      start_step:
        description: "Первый шаг обучения"
        required: true
        default: 1
        type: number
      end_step:
        description: "Последний шаг"
        required: true
        default: 2
        type: number
      max_steps:
        description: "Обрезка шага (0 = полный shard; для CPU ставь 100-300)"
        required: false
        default: "0"
        type: string

  push:
    branches: [main]
    paths:
      - "config/**"
      - "src/**"
      - "steps/**"
      - "scripts/**"
      - "orchestrator.py"
      - ".github/workflows/train.yml"
      - ".github/workflows/pipeline.yml"
  # Смоук прямо на pull_request: весь пайплайн (данные -> токенизация -> обучение
  # -> чекпоинт -> график) прогоняется на демо-корпусе за минуты. Так починка
  # доказывается сама, ещё до мержа в main.
  pull_request:
    paths:
      - "config/**"
      - "src/**"
      - "steps/**"
      - "scripts/**"
      - "orchestrator.py"
      - ".github/workflows/pipeline.yml"

concurrency:
  group: ci-train-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  HF_HOME: ${{ github.workspace }}/hf-cache
  TORCH_HOME: ${{ github.workspace }}/torch-cache
  GRAD_CACHE: ${{ github.workspace }}/grad-cache
  # Если в настройках репозитория добавлен секрет HF_TOKEN, скачивание с
  # HuggingFace идёт быстрее и без предупреждений о лимите. Пусто — не мешает.
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  finetune:
    runs-on: ubuntu-latest
    # На PR — короткий смоук, чтобы проверка не висела часами.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 300 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установка зависимостей
        run: |
          pip install -r requirements.txt
          pip install gdown

      - name: Кэш модели (HF) — восстановить при повторных запусках
        id: cache-model
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/hf-cache
            ${{ github.workspace }}/torch-cache
          key: hf-${{ runner.os }}-rugpt3-${{ github.sha }}
          restore-keys: |
            hf-${{ runner.os }}-rugpt3-

      - name: Восстановить чекпоинт из прошлого запуска
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ci-checkpoint-progress
          run-id: ${{ github.event.inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: .

      - name: Данные (Drive / датасет / демо) + токенизация
        # Потолок по времени: ручной Drive-прогон одной части может быть большим.
        timeout-minutes: 120
        env:
          # На PR — всегда демо (мгновенно, без сети к Drive).
          DATA_SOURCE: ${{ github.event.inputs.data_source || (github.event_name == 'pull_request' && 'demo' || 'auto') }}
          DRIVE_FOLDER_URL: ${{ github.event.inputs.drive_folder_url || 'https://drive.google.com/drive/folders/1u_rcfQ6P50bK4H23tmrh20U_2BRDVEm5' }}
          # Пусто -> берём ru-classic: если Drive не отдаст текст, каскад дойдёт до HF.
          HF_DATASET: ${{ github.event.inputs.hf_dataset || 'Imperius/ru-classic' }}
          LIMIT_MB: ${{ github.event.inputs.data_limit_mb || (github.event_name == 'pull_request' && '5' || '25') }}
          DRIVE_INCLUDE_REGEX: ${{ github.event.inputs.drive_file_regex || '' }}
          DRIVE_MAX_FILES: ${{ github.event.inputs.drive_max_files || '0' }}
          DRIVE_BUDGET_S: ${{ github.event.inputs.drive_budget_s || (github.event_name == 'workflow_dispatch' && '3600' || '900') }}
        run: python steps/step_00_ci_data.py

      - name: Дообучение шагов ${{ github.event.inputs.start_step || 1 }}..${{ github.event.inputs.end_step || 2 }}
        env:
          # На PR — 60 итераций: проверяем, что цикл живой, а не гоним эпохи.
          MAX_STEPS: ${{ github.event.inputs.max_steps || (github.event_name == 'pull_request' && '60' || '0') }}
          EPOCHS_PER_STEP: "1"
          LOG_EVERY_STEPS: "5"
          RESUME_FROM_LATEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.resume_run_id != '' && '1' || '' }}
          # ВАЖНО: NUM_WORKERS может быть "auto" (наша договорённость),
          # а OMP_NUM_THREADS — НЕТ: libgomp понимает только число и падал
          # с «Недопустимое значение переменной окружения OMP_NUM_THREADS».
        run: |
          NPROC=$(nproc)
          echo "Раннер: $NPROC ядер CPU, $(free -m | awk '/Mem:/{print $2}') МБ RAM"
          # Число потоков считаем здесь же и передаём дальше уже числом.
          export OMP_NUM_THREADS=$NPROC
          export NUM_WORKERS=auto
          python orchestrator.py \
            --start ${{ github.event.inputs.start_step || 1 }} \
            --end ${{ github.event.inputs.end_step || 2 }} \
            --device cpu \
            --evaluate

      - name: Пробные ответы модели
        if: always()
        run: |
          mkdir -p logs
          if compgen -G "checkpoints/step_*/last.pt" > /dev/null; then
            python scripts/evaluate_prompts.py \
              --limit 12 \
              --out logs/eval_answers.md || true
          else
            echo "# Пробные ответы модели" > logs/eval_answers.md
            echo "" >> logs/eval_answers.md
            echo "Чекпоинт не найден — генерацию ответов пропускаю." >> logs/eval_answers.md
          fi

      - name: Выкачать прогресс (логи + график + пробные ответы)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-checkpoint-progress
          path: |
            logs/*.jsonl
            logs/progress.svg
            logs/eval_answers.md
            checkpoints/**/*.pt
          if-no-files-found: warn

      - name: Сводка в Job Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 📈 Дообучение в Actions (CPU)"
            echo ""
            echo "| шаг | loss (первый → последний) |"
            echo "| --- | --- |"
            for f in logs/step_*.jsonl; do
              [ -f "$f" ] || continue
              first=$(python -c "import json;d=[json.loads(l) for l in open('$f')];e=[x for x in d if x.get('event')=='train'];print(e[0]['loss'] if e else '-')")
              last=$(python -c "import json;d=[json.loads(l) for l in open('$f')];e=[x for x in d if x.get('event')=='train'];print(e[-1]['loss'] if e else '-')")
              echo "| \`$(basename "$f")\` | $first → $last |"
            done
            echo ""
            if [ -f logs/progress.svg ]; then
              echo "График loss сохранён в артефакт \`ci-checkpoint-progress\`."
            fi
            if [ -f logs/eval_answers.md ]; then
              echo ""
              echo "### Пробные ответы"
              echo ""
              sed -n '1,120p' logs/eval_answers.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
